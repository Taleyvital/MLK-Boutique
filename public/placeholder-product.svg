<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <rect width="400" height="500" fill="#f6e6e5"/>
  <!-- Shopping woman silhouette simplified -->
  <g transform="translate(200, 250)" fill="#4c0002" opacity="0.15">
    <!-- Body -->
    <ellipse cx="0" cy="-60" rx="28" ry="38"/>
    <!-- Head -->
    <circle cx="0" cy="-110" r="20"/>
    <!-- Hair bun -->
    <ellipse cx="0" cy="-132" rx="14" ry="10"/>
    <!-- Left arm with bags -->
    <rect x="-55" y="-80" width="12" height="45" rx="6" transform="rotate(-15 -55 -80)"/>
    <!-- Bag left 1 -->
    <rect x="-90" y="-50" width="32" height="38" rx="4"/>
    <rect x="-85" y="-55" width="22" height="8" rx="2"/>
    <!-- Bag left 2 -->
    <rect x="-72" y="-30" width="28" height="35" rx="4"/>
    <!-- Right arm -->
    <rect x="42" y="-78" width="12" height="42" rx="6" transform="rotate(12 42 -78)"/>
    <!-- Bag right -->
    <rect x="48" y="-42" width="30" height="36" rx="4"/>
    <rect x="52" y="-48" width="20" height="8" rx="2"/>
    <!-- Skirt/dress -->
    <path d="M-28 -22 Q-45 30 -35 80 Q0 70 35 80 Q45 30 28 -22 Z"/>
    <!-- Legs -->
    <rect x="-18" y="78" width="12" height="35" rx="6"/>
    <rect x="8" y="78" width="12" height="35" rx="6"/>
  </g>
  <!-- Brand text -->
  <text x="200" y="460" font-family="serif" font-size="14" fill="#4c0002" opacity="0.5" text-anchor="middle" letter-spacing="3">MLK-BOUTIQUE</text>
</svg>
